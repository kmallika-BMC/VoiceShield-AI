services:
  - type: web
    name: voiceshield-backend
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://frontend-dusky-eta-30.vercel.app
      - key: DATABASE_PATH
        value: /app/data/voiceshield
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: POLYGON_PRIVATE_KEY
        sync: false
      - key: POLYGON_CONTRACT_ADDRESS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "1000"
    disk:
      name: voiceshield-data
      mountPath: /app/data
      sizeGB: 1
